{% load static %}
<section class="bg-white">
  <div class="container mx-auto px-3 py-3">
    <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-10 gap-3 text-center">
      {% for category in categories %}
      <a href="{{ category.url }}" class="group">
        <div class="w-14 h-14 mx-auto rounded-full overflow-hidden ring-1 ring-gray-200">
          <img src="{{ category.image_url }}" alt="{{ category.name }}" class="w-full h-full object-cover group-hover:scale-105 transition" />
        </div>
        <p class="text-[11px] mt-1 text-gray-700">{{ category.name }}</p>
      </a>
      {% empty %}
      <a href="#" class="group">
        <div class="w-14 h-14 mx-auto rounded-full overflow-hidden ring-1 ring-gray-200">
          <img src="{% static 'images/products/1.jpg' %}" alt="Dresses" class="w-full h-full object-cover group-hover:scale-105 transition" />
        </div>
        <p class="text-[11px] mt-1 text-gray-700">Dresses</p>
      </a>
