<aside id="filters" class="hidden md:block w-full md:w-1/4 lg:w-1/5">
  <div class="sticky top-20 bg-white border border-gray-200 rounded-lg p-4">
    <div class="flex items-center justify-between mb-4 border-b border-gray-100 pb-3">
      <h3 class="text-sm font-bold">Filter</h3>
      <button type="button" class="text-xs text-gray-500 hover:text-black">Clear</button>
    </div>

    <details open class="mb-4 border-b border-gray-100 pb-3">
      <summary class="cursor-pointer text-sm font-semibold">Category</summary>
      <div class="mt-3 space-y-2 max-h-44 overflow-auto pr-1">
        {% for cat in filters.categories %}
        <label class="flex items-center text-sm text-gray-700">
          <input type="radio" name="category" class="mr-2">
          {{ cat }}
        </label>
        {% endfor %}
      </div>
    </details>

    <details open class="mb-4 border-b border-gray-100 pb-3">
      <summary class="cursor-pointer text-sm font-semibold">Size</summary>
      <div class="mt-3 grid grid-cols-3 gap-2">
        <button type="button" class="border border-gray-300 rounded py-1 text-xs">XS</button>
        <button type="button" class="border border-gray-300 rounded py-1 text-xs">S</button>
        <button type="button" class="border border-gray-300 rounded py-1 text-xs">M</button>
        <button type="button" class="border border-gray-300 rounded py-1 text-xs">L</button>
        <button type="button" class="border border-gray-300 rounded py-1 text-xs">XL</button>
        <button type="button" class="border border-gray-300 rounded py-1 text-xs">XXL</button>
      </div>
    </details>

    {% for group, values in filters.facet_groups.items %}
    <details open class="mb-4 border-b border-gray-100 pb-3">
      <summary class="cursor-pointer text-sm font-semibold capitalize">{{ group }}</summary>
      <div class="mt-3 space-y-2 max-h-36 overflow-auto pr-1">
        {% for value in values %}
        <label class="flex items-center text-sm text-gray-700">
          <input type="checkbox" class="mr-2 rounded border-gray-300">
          {{ value }}
        </label>
        {% endfor %}
      </div>
    </details>
    {% endfor %}

    <details open class="mb-4 pb-1">
      <summary class="cursor-pointer text-sm font-semibold">Price Range (USD)</summary>
      <div class="mt-3">
        <input type="range" min="{{ filters.price_min|floatformat:0 }}" max="{{ filters.price_max|floatformat:0 }}" class="w-full accent-black">
        <div class="flex justify-between text-xs text-gray-500 mt-2">
          <span>${{ filters.price_min|floatformat:0 }}</span>
          <span>${{ filters.price_max|floatformat:0 }}</span>
        </div>
      </div>
    </details>
  </div>
</aside>
