{% load static %}
<section class="bg-white">
  <div class="container mx-auto px-3 py-4">
    <h3 class="text-base md:text-lg font-bold mb-3">Featured</h3>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

      {% for product in popular_products|slice:":4" %}
      <a href="/products/{{ product.slug }}/" class="bg-gray-50 rounded-lg p-2 block hover:shadow-sm transition">
        <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-full h-28 object-cover rounded-md" />
        <h3 class="text-sm font-semibold">{{ product.name|truncatechars:20 }}</h3>
      </a>
      {% empty %}
      <a href="#" class="bg-gray-50 rounded-lg p-2 block hover:shadow-sm transition">
        <img src="{% static 'images/products/3.jpg' %}" alt="Top picks" class="w-full h-28 object-cover rounded-md" />
        <p class="text-xs text-gray-500 mt-2">Bags Edit</p>
        <h3 class="text-sm font-semibold">Top Picks</h3>
      </a>
      <a href="#" class="bg-gray-50 rounded-lg p-2 block hover:shadow-sm transition">
        <img src="{% static 'images/products/2.jpg' %}" alt="Try this" class="w-full h-28 object-cover rounded-md" />
        <p class="text-xs text-gray-500 mt-2">For You</p>
        <h3 class="text-sm font-semibold">Try This Style</h3>
      </a>
      <a href="#" class="bg-gray-50 rounded-lg p-2 block hover:shadow-sm transition">
        <img src="{% static 'images/products/8.jpg' %}" alt="New bag drop" class="w-full h-28 object-cover rounded-md" />
        <p class="text-xs text-gray-500 mt-2">New In</p>
        <h3 class="text-sm font-semibold">Bag Drop</h3>
      </a>
      <a href="#" class="bg-gray-50 rounded-lg p-2 block hover:shadow-sm transition">
        <img src="{% static 'images/products/6.jpg' %}" alt="Beauty picks" class="w-full h-28 object-cover rounded-md" />
        <p class="text-xs text-gray-500 mt-2">Beauty</p>
        <h3 class="text-sm font-semibold">Glow Picks</h3>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
