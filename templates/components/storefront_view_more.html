<section class="bg-[#f5f5f5] py-6 border-t border-b border-gray-200">
  <div class="container mx-auto px-3 text-center">
    <button
      id="load-more-btn"
      class="inline-flex items-center justify-center min-w-[180px] px-8 py-3 border border-gray-500 bg-white text-gray-900 font-semibold hover:bg-gray-50 transition"
    >
      <span>View More</span>
      <i class="fas fa-arrow-down ml-2" id="load-more-icon"></i>
      {% comment %} <svg id="load-more-spinner" class="hidden animate-spin ml-2 h-5 w-5 text-gray-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg> {% endcomment %}
    </button>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    let offset = 10;
    const limit = 10;
    let isLoading = false;
    let allLoaded = false;
    
    const loadMoreBtn = document.getElementById('load-more-btn');
    const loadMoreText = loadMoreBtn ? loadMoreBtn.querySelector('span') : null;
    const loadMoreIcon = document.getElementById('load-more-icon');
    const loadMoreSpinner = document.getElementById('load-more-spinner');
    const productsGrid = document.getElementById('products-grid-container');

    if (!loadMoreBtn || !productsGrid) return;

    function fetchMoreProducts() {
      if (isLoading || allLoaded) return;
      isLoading = true;
      
      if (loadMoreText) { loadMoreText.innerText = 'Loading...'; }
      if (loadMoreIcon) { loadMoreIcon.classList.add('hidden'); }
      if (loadMoreSpinner) { loadMoreSpinner.classList.remove('hidden'); }
      
      fetch(`/api/load-more-products/?offset=${offset}&limit=${limit}`)
        .then(response => response.text())
        .then(html => {
          if (html.trim() === '' || html.includes('No products found')) {
            allLoaded = true;
            loadMoreBtn.style.display = 'none';
          } else {
            productsGrid.insertAdjacentHTML('beforeend', html);
            offset += limit;
          }
        })
        .catch(err => console.error('Error fetching more products:', err))
        .finally(() => {
          isLoading = false;
          if (!allLoaded) {
            if (loadMoreText) { loadMoreText.innerText = 'View More'; }
            if (loadMoreIcon) { loadMoreIcon.classList.remove('hidden'); }
            if (loadMoreSpinner) { loadMoreSpinner.classList.add('hidden'); }
          }
        });
    }

    loadMoreBtn.addEventListener('click', function(e) {
      e.preventDefault();
      fetchMoreProducts();
    });

    window.addEventListener('scroll', function() {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        fetchMoreProducts();
      }
    });
  });
</script>
