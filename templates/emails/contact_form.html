<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission - MukhtaleefWear</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
        }
        .header {
            background-color: #111827; /* Premium Dark Navy/Black */
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header p {
            color: #9ca3af;
            font-size: 13px;
            margin: 8px 0 0 0;
        }
        .content {
            padding: 40px 30px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #9ca3af;
            margin-bottom: 12px;
        }
        .meta-card {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 30px;
        }
        .meta-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .meta-row:last-child {
            border-bottom: none;
        }
        .label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
        }
        .value {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
        }
        .message-box {
            background-color: #fffbeb; /* Gentle amber accent */
            border-left: 4px solid #f59e0b;
            border-radius: 4px 12px 12px 4px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .message-text {
            font-size: 15px;
            color: #374151;
            line-height: 1.6;
            white-space: pre-wrap;
            margin: 0;
        }
        .footer {
            background-color: #f9fafb;
            padding: 25px;
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
        }
        .footer p {
            margin: 4px 0;
        }
        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
                margin: 0 !important;
                border-radius: 0 !important;
                border: none !important;
            }
            .content {
                padding: 25px 15px !important;
            }
            .meta-card {
                padding: 15px 12px !important;
                margin-bottom: 20px !important;
            }
            .message-box {
                padding: 15px !important;
            }
            .meta-row {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 4px !important;
            }
            .label {
                font-size: 11px !important;
            }
            .value {
                font-size: 13px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>MukhtaleefWear</h1>
            <p>New Customer Contact Inquiry</p>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="section-title">Inquiry Details</div>
            <div class="meta-card">
                <div class="meta-row">
                    <span class="label">Sender Name: </span>
                    <span class="value">{{ name }}</span>
                </div>
                <div class="meta-row">
                    <span class="label">Sender Email: </span>
                    <span class="value"><a href="mailto:{{ email }}" style="color: #111827; text-decoration: underline;">{{ email }}</a></span>
                </div>
                <div class="meta-row">
                    <span class="label">Subject: </span>
                    <span class="value">{{ subject }}</span>
                </div>
            </div>

            <div class="section-title">Message Content</div>
            <div class="message-box">
                <p class="message-text">{{ message }}</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2026 MukhtaleefWear. All rights reserved.</p>
            <p>This inquiry was submitted from the MukhtaleefWear Contact Us portal.</p>
        </div>
    </div>
</body>
</html>
