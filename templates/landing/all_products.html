{% load static %}

<section id="all-products" class="py-10">
  <div class="container mx-auto">
    <h1 class="text-3xl md:text-4xl font-bold text-center mb-10">All Products</h1>
    
    <div class="flex flex-wrap -mx-4">
      {% for product in products %}
      <div class="w-full sm:w-1/2 md:w-1/3 lg:w-1/4 px-4 mb-8">
        <div class="product-card bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition duration-300">
          <div class="relative overflow-hidden h-64">
            <img
              src="{{ product.image_url }}"
              alt="{{ product.name }}"
              class="w-full h-full object-cover hover:scale-110 transition duration-300"
            />
          </div>
          <div class="p-4">
            <h3 class="text-lg font-semibold mb-2">{{ product.name }}</h3>
            {% if product.variant_label %}
            <p class="text-sm text-gray-500 mb-2">{{ product.variant_label }}</p>
            {% endif %}
            <p class="text-primary font-bold text-xl">PKR {{ product.price }}</p>
            <a
              href="{% url 'product_detail' slug=product.slug %}"
              class="block text-center mt-4 bg-primary text-white px-4 py-2 hover:bg-primary-dark transition duration-300"
              >View Product</a
            >
          </div>
        </div>
      </div>
      {% empty %}
      <div class="w-full text-center py-10">
        <p class="text-gray-500">No products available.</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
